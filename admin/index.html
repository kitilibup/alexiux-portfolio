<!--
  Security policy for the CMS (GitHub Pages can't send headers, so it's a meta tag).
  Scripts only from this site - no inline script, no eval - so content shown in the
  editor can't run code and reach the sign-in token. Network access only to this
  site, the GitHub API, the sign-in Worker and the two form services. The editor's
  iframes inherit this policy.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' data: blob:; connect-src 'self' https://api.github.com https://*.workers.dev https://api.web3forms.com https://formspree.io https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://www.youtube.com https://player.vimeo.com https://fast.wistia.net https://www.loom.com https://cdn.embedly.com; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
